server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's built-in DNS. With the address in a variable nginx looks it up again as it
    # goes, so restarting the API (new address) does not leave the web server pointing nowhere.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 6m;
    }

    # Built files have hashed names, so they never change under the same name.
    location /assets/ {
        # nginx's built-in table does not know .mjs, and a browser refuses to start a module
        # worker (pdf.js) that is not labelled JavaScript. Defining types here replaces the
        # inherited table, so the standard file is included again and .mjs added to it.
        include /etc/nginx/mime.types;
        types {
            application/javascript mjs;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other address is a page of the app (client-side routing).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
