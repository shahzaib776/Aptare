name: CI

on:
  pull_request:
  # Work goes straight to main, so main must run CI too.
  push:
    branches: [main]
  # The "Run workflow" button on the Actions page.
  workflow_dispatch:

# Runners are pinned (not `ubuntu-latest`) so the OS, and the Python it ships, change only when we
# choose; each project's .python-version pins Python 3.12 the same way.
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The same marker expressions `make test` uses: only the backend defines `live`.
        include:
          - project: backend
            marks: not compile and not live
          - project: compiler
            marks: not compile
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -m "${{ matrix.marks }}"

  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f compiler/Dockerfile --target test -t aptare-compiler-test .
      - run: docker run --rm --network none aptare-compiler-test

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p data
      - run: APTARE_UID=$(id -u) APTARE_GID=$(id -g) docker compose up -d --build --wait
      - run: python3 scripts/smoke.py
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
