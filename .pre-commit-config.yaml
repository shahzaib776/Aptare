repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'for d in backend compiler; do (cd $d && uv run ruff check --fix && uv run ruff format) || exit 1; done'
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: bash -c 'for d in backend compiler; do (cd $d && uv run mypy) || exit 1; done'
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
